name: secureflow_mobile
description: SecureFlow — Intelligence-Grade Mobile Vault

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Cryptography ──────────────────────────────────────────────────────
  pointycastle: ^3.9.1           # AES-256-GCM, HKDF-SHA256
  convert: ^3.1.1                # Hex/Base64 encoding

  # ── AWS S3 ───────────────────────────────────────────────────────────
  aws_signature_v4: ^0.6.3      # AWS SigV4 request signing
  aws_common: ^0.7.13           # AWS HTTP primitives (AWSHttpRequest, etc.)
  http: ^1.2.0                   # HTTP client

  # ── Auth & Security ──────────────────────────────────────────────────
  local_auth: ^2.3.0             # Biometric (fingerprint/face)
  flutter_secure_storage: ^9.2.2 # Secure key/secret storage
  nfc_manager: ^3.3.0            # NFC tag reading

  # ── State Management ─────────────────────────────────────────────────
  flutter_riverpod: ^2.5.1

  # ── TOTP ─────────────────────────────────────────────────────────────
  otp: ^3.1.4

  # ── UI ───────────────────────────────────────────────────────────────
  flutter_staggered_grid_view: ^0.7.0
  google_fonts: ^6.2.1

  # ── Utilities ────────────────────────────────────────────────────────
  flutter_dotenv: ^5.1.0
  uuid: ^4.4.2
  intl: ^0.19.0
  path_provider: ^2.1.3
  mobile_scanner: ^7.2.0
  file_picker: ^11.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
